# 提炼策略。默认模型沿用“用户自己的模型”原则：
#   provider=claude-cli 使用本机 Claude 订阅；provider=api 使用任意 OpenAI 兼容接口。
# 每个赛道可覆盖 prompt、模型与输出结构，未覆盖时回落到 default。
digest:
  version: 1
  provider: claude-cli
  default_model: user-model   # 占位符：用 CLI 默认模型；填真实模型名才会转发给 provider
  language: zh
  max_items_per_topic: 12
  timeout_sec: 180
  retries: 2
  output_schema: TopicDigest
  # provider: gateway 时使用生态统一模型网关；不可用时自动降级 claude-cli。
  # 密钥只从环境变量读取，禁止写进本文件。
  gateway:
    base_url: ${QF_WIRE_MODEL_GATEWAY_URL}
    api_key_env: QF_WIRE_MODEL_GATEWAY_KEY
  topics:
    ai:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    semiconductor:
      prompt_file: prompts/semiconductor.md
      output_schema: TopicDigest
      model: user-model          # 可选：按赛道覆盖 default_model
    robotics:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    automotive:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    energy:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    biotech:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    aerospace:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    cybersecurity:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    tech:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    consumer:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    macro:
      prompt_file: prompts/policy.md
      output_schema: BriefDigest  # 政策简报只保留摘要与要点，条目由本地数据补齐
    science:
      prompt_file: prompts/default.md
      output_schema: TopicDigest
    default:
      prompt_file: prompts/default.md
      output_schema: TopicDigest

# 事件聚类阈值（同一赛道内多条报道折叠为同一事件）。
# 调高 similarity_threshold 更保守（更少归并），调低更激进；window_hours 是回溯窗口。
cluster:
  similarity_threshold: 0.56
  simhash_threshold: 0.86
  simhash_floor: 0.30
  entity_boost: 0.08
  window_hours: 168
